<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150">
  <defs>
    <linearGradient id="tubeGlass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#12181c"/>
      <stop offset="0.22" stop-color="#5c7f93"/>
      <stop offset="0.45" stop-color="#b9d7e8"/>
      <stop offset="0.58" stop-color="#2d5369"/>
      <stop offset="1" stop-color="#0c1114"/>
    </linearGradient>
    <linearGradient id="headerMetal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.5" stop-color="#b8bec2"/>
      <stop offset="1" stop-color="#6e777d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g id="solar_thermal_panel" transform="skewX(-10)" filter="url(#softShadow)">
