    <rect id="bottom_rail" x="18" y="128" width="190" height="6" rx="2" fill="#8d969c" stroke="#4f565a" stroke-width="1.5"/>

    <g id="vacuum_tubes" stroke="#1c252b" stroke-width="1.2">
